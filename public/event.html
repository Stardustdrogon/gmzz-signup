<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">活动报名</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="stars-bg"></div>
    <div class="container">
        <!-- 顶部导航 -->
        <div class="top-nav">
            <a href="/" class="back-btn">← 返回</a>
            <div class="event-badge" id="eventBadge"></div>
            <button id="adminBtn" class="admin-btn" onclick="toggleAdmin()">🔓 管理</button>
        </div>

        <!-- 活动信息 -->
        <div class="event-header" id="eventHeader">
            <div class="week-badge" id="weekBadge">第 -- 周</div>
            <h1 class="event-title" id="eventTitle">--</h1>
            <p class="event-meta" id="eventMeta">--</p>
            <div class="event-countdown" id="eventCountdown">
                <span class="countdown-label">距报名截止</span>
                <span class="countdown-time" id="countdownTime">--:--:--</span>
            </div>
            <div class="event-stats">
                <div class="stat-item">
                    <span class="stat-num" id="totalNum">0</span>
                    <span class="stat-label">已报名</span>
                </div>
            </div>
        </div>

        <!-- 报名表单 -->
        <div class="form-section">
            <h2 class="section-title">✍️ 我要报名</h2>
            <form id="signupForm" class="signup-form">
                <div class="form-group">
                    <label>游戏昵称</label>
                    <input type="text" id="nameInput" placeholder="输入你的游戏昵称" maxlength="20" required>
                </div>

                <div class="form-group">
                    <label>职业</label>
                    <div class="profession-selector" id="profSelector">
                        <button type="button" class="prof-btn" data-prof="战士">⚔️ 战士</button>
                        <button type="button" class="prof-btn" data-prof="占卜家">🔮 占卜家</button>
                        <button type="button" class="prof-btn" data-prof="窥秘人">👁️ 窥秘人</button>
                        <button type="button" class="prof-btn" data-prof="观众（奶）">💚 观众(奶)</button>
                        <button type="button" class="prof-btn" data-prof="学徒">📖 学徒</button>
                        <button type="button" class="prof-btn" data-prof="歌颂者">🎵 歌颂者</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>备注（选填）</label>
                    <input type="text" id="remarkInput" placeholder="替补/迟到/其他说明" maxlength="30">
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">确认报名</button>
            </form>
        </div>

        <!-- 职业统计 -->
        <div class="stats-section" id="statsSection">
            <h2 class="section-title">📊 职业分布</h2>
            <div class="prof-stats" id="profStats"></div>
        </div>

        <!-- 报名列表 -->
        <div class="list-section">
            <div class="list-header">
                <h2 class="section-title">👥 报名名单 <span class="list-count" id="listCount">0</span></h2>
            </div>
            <div class="member-list" id="memberList">
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <p>暂无报名，来第一个报名吧！</p>
                </div>
            </div>
        </div>

        <!-- 底部返回键 -->
        <div class="bottom-actions">
            <a href="/" class="btn-back-home">← 返回首页</a>
        </div>

        <div class="footer-space"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="/app.js"></script>
    <script>
        const eventKey = window.location.pathname.split('/').pop();
        initEventPage(eventKey);
    </script>
</body>
</html>
