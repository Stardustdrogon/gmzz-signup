<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">活动报名</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="stars-bg"></div>
    <div class="container">
        <!-- 顶部导航 -->
        <div class="top-nav">
            <a href="/" class="back-btn">← 返回</a>
            <div class="event-badge" id="eventBadge"></div>
        </div>

        <!-- 活动信息 -->
        <div class="event-header" id="eventHeader">
            <h1 class="event-title" id="eventTitle">--</h1>
            <p class="event-meta" id="eventMeta">--</p>
            <div class="event-stats">
                <div class="stat-item">
                    <span class="stat-num" id="totalNum">0</span>
                    <span class="stat-label">已报名</span>
                </div>
                <div class="stat-item" id="bothStat" style="display:none;">
                    <span class="stat-num" id="bothNum">0</span>
                    <span class="stat-label">双场</span>
                </div>
            </div>
        </div>

        <!-- 报名表单 -->
        <div class="form-section">
            <h2 class="section-title">✍️ 我要报名</h2>
            <form id="signupForm" class="signup-form">
                <div class="form-group">
                    <label>游戏昵称</label>
                    <input type="text" id="nameInput" placeholder="输入你的游戏昵称" maxlength="20" required>
                </div>

                <div class="form-group">
                    <label>职业</label>
                    <div class="profession-selector" id="profSelector">
                        <button type="button" class="prof-btn" data-prof="战士">⚔️ 战士</button>
                        <button type="button" class="prof-btn" data-prof="占卜家">🔮 占卜家</button>
                        <button type="button" class="prof-btn" data-prof="窥秘人">👁️ 窥秘人</button>
                        <button type="button" class="prof-btn" data-prof="观众（奶）">💚 观众(奶)</button>
                        <button type="button" class="prof-btn" data-prof="学徒">📖 学徒</button>
                        <button type="button" class="prof-btn" data-prof="歌颂者">🎵 歌颂者</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>参加场次</label>
                    <div class="event-selector" id="eventSelector">
                        <label class="event-option">
                            <input type="checkbox" id="checkThursday" value="thursday">
                            <span class="event-check">
                                <span class="event-name">周四 · 霜陨领主</span>
                            </span>
                        </label>
                        <label class="event-option">
                            <input type="checkbox" id="checkSaturday" value="saturday">
                            <span class="event-check">
                                <span class="event-name">周六 · 猎城战</span>
                            </span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>备注（选填）</label>
                    <input type="text" id="remarkInput" placeholder="替补/迟到/其他说明" maxlength="30">
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">确认报名</button>
            </form>
        </div>

        <!-- 操作栏 -->
        <div class="action-bar">
            <button class="btn-secondary" onclick="showBatchModal()">📋 批量导入</button>
            <button class="btn-secondary" onclick="copyList()">📄 复制名单</button>
        </div>

        <!-- 职业统计 -->
        <div class="stats-section" id="statsSection">
            <h2 class="section-title">📊 职业分布</h2>
            <div class="prof-stats" id="profStats"></div>
        </div>

        <!-- 报名列表 -->
        <div class="list-section">
            <div class="list-header">
                <h2 class="section-title">👥 报名名单 <span class="list-count" id="listCount">0</span></h2>
                <div class="list-filter" id="listFilter" style="display:none;">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="both">双场</button>
                </div>
            </div>
            <div class="member-list" id="memberList">
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <p>暂无报名，来第一个报名吧！</p>
                </div>
            </div>
        </div>

        <div class="footer-space"></div>
    </div>

    <!-- 批量导入弹窗 -->
    <div class="modal" id="batchModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>批量导入名单</h3>
                <button class="modal-close" onclick="hideBatchModal()">×</button>
            </div>
            <div class="modal-body">
                <p class="modal-tip">每行一人，格式：<br><code>姓名 职业 周四 周六</code><br>
                职业写简称也能识别（如"奶"=观众奶）<br>
                周四/周六用"是/否"或"1/0"表示</p>
                <textarea id="batchText" placeholder="示例：&#10;张三 战士 是 是&#10;李四 奶 1 0&#10;王五 占卜家 周四 周六"></textarea>
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="hideBatchModal()">取消</button>
                    <button class="btn-primary" onclick="doBatchImport()">确认导入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="/app.js"></script>
    <script>
        // 初始化活动页面
        const eventKey = window.location.pathname.split('/').pop(); // thursday / saturday
        initEventPage(eventKey);
    </script>
</body>
</html>
