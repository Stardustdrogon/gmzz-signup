<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>诡秘之主 · 活动报名</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="stars-bg"></div>
    <div class="container">
        <!-- 头部 -->
        <div class="home-header">
            <h1 class="home-title">⚔️ 活动报名</h1>
            <p class="home-subtitle">愚者议会 · 每周活动报名系统</p>
            <div class="week-badge-home" id="weekBadge">第 -- 周</div>
        </div>

        <!-- 三宫格 -->
        <div class="home-grid three-col">
            <!-- 周四 -->
            <div class="home-card card-thursday" onclick="goEvent('thursday')">
                <div class="card-icon">❄️</div>
                <div class="card-title">周四 · 霜陨领主</div>
                <div class="card-time">晚上 7:00 开战</div>
                <div class="card-countdown" id="thuCountdown">--:--:--</div>
                <div class="card-deadline" id="thuDeadline">报名截止: --</div>
                <div class="card-count"><span id="thuCount">0</span> 人已报名</div>
            </div>

            <!-- 周六 -->
            <div class="home-card card-saturday" onclick="goEvent('saturday')">
                <div class="card-icon">🏹</div>
                <div class="card-title">周六 · 猎城战</div>
                <div class="card-time">晚上 7:00 开战</div>
                <div class="card-countdown" id="satCountdown">--:--:--</div>
                <div class="card-deadline" id="satDeadline">报名截止: --</div>
                <div class="card-count"><span id="satCount">0</span> 人已报名</div>
            </div>

            <!-- 总名单 -->
            <div class="home-card card-all" onclick="location.href='/all.html'">
                <div class="card-icon">📋</div>
                <div class="card-title">总名单</div>
                <div class="card-time">两场活动汇总</div>
                <div class="card-deadline">实时更新</div>
                <div class="card-count"><span id="totalCount">0</span> 人报名</div>
            </div>
        </div>

        <!-- 底部操作 -->
        <div class="home-actions">
            <button class="btn-secondary" onclick="downloadExcel()">📊 下载本周 Excel</button>
        </div>

        <!-- 下次重置 -->
        <div class="reset-info">
            下次重置: <span id="nextReset">--</span>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        // 首页逻辑
        function goEvent(key) {
            location.href = '/event.html?event=' + key;
        }

        function downloadExcel() {
            window.location.href = '/api/excel';
        }

        function loadHomeStats() {
            fetch('/api/members')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('thuCount').textContent = data.totals.thursday;
                    document.getElementById('satCount').textContent = data.totals.saturday;
                    document.getElementById('totalCount').textContent = data.totals.total;
                    document.getElementById('weekBadge').textContent = '第 ' + data.week + ' 周';
                });
        }

        function loadDeadlines() {
            fetch('/api/week')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('weekBadge').textContent = '第 ' + data.week + ' 周';
                    document.getElementById('thuDeadline').textContent = '报名截止: ' + data.thursdayDeadlineStr;
                    document.getElementById('satDeadline').textContent = '报名截止: ' + data.saturdayDeadlineStr;
                    document.getElementById('nextReset').textContent = data.nextResetStr;
                    // 启动倒计时
                    startCountdown('thuCountdown', data.thursdayDeadline);
                    startCountdown('satCountdown', data.saturdayDeadline);
                });
        }

        function startCountdown(elementId, targetTs) {
            function update() {
                const el = document.getElementById(elementId);
                if (!el) return;
                const now = Math.floor(Date.now() / 1000);
                const diff = targetTs - now;
                if (diff <= 0) {
                    el.textContent = '已截止';
                    el.classList.add('countdown-closed');
                    return;
                }
                const d = Math.floor(diff / 86400);
                const h = Math.floor((diff % 86400) / 3600);
                const m = Math.floor((diff % 3600) / 60);
                const s = diff % 60;
                if (d > 0) {
                    el.textContent = d + '天 ' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
                } else {
                    el.textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
                }
            }
            update();
            setInterval(update, 1000);
        }

        // SSE 实时更新
        function connectSSE() {
            const es = new EventSource('/api/stream');
            es.addEventListener('member_updated', () => loadHomeStats());
            es.addEventListener('member_removed', () => loadHomeStats());
            es.addEventListener('batch_imported', () => loadHomeStats());
            es.addEventListener('week_reset', (e) => {
                const d = JSON.parse(e.data);
                alert('进入第 ' + d.newWeek + ' 周！' + (d.message || ''));
                loadHomeStats();
                loadDeadlines();
            });
            es.onerror = () => {
                setTimeout(connectSSE, 3000);
            };
        }

        loadHomeStats();
        loadDeadlines();
        connectSSE();
    </script>
</body>
</html>
